appId: com.taimio.app
productName: TAIMIO
copyright: Copyright © TAIMIO
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!design/*'
  - '!TAIMIO_START/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!*.md'
  - '!key-service/**'
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: resources/whisper-runtime
    to: whisper
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
win:
  executableName: TAIMIO
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: TAIMIO_Beta_Setup.${ext}
  include: build/installer-setup.nsh
  shortcutName: TAIMIO
  uninstallDisplayName: TAIMIO
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  installerLanguages:
    - ru
portable:
  artifactName: TAIMIO-${version}-portable.${ext}
npmRebuild: false
